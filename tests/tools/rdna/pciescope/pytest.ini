[pytest]
# This file makes tests/tools/rdna/pciescope the rootdir and the conftest cut-off, so
# `python -m pytest tests/tools/rdna/pciescope` never loads the repository-wide
# tests/conftest.py (it imports vLLM and tblib, which these CPU-only tests do not need)
# and ignores the repository's pytest options. The cache provider is off: nothing is
# written next to the sources. conftest.py moves the temp files under ~/w4a8_runs.
addopts = -p no:cacheprovider
